    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              }
            });
          } catch (_) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return currentFetch;
                },
                set: function (fn) {
                  if (typeof fn === 'function') {
                    currentFetch = fn;
                  }
                }
              });
            }
          } catch (_) {}
          window.addEventListener(
            'error',
            function (event) {
              var msg = String((event && event.message) || '');
              var file = String((event && event.filename) || '');
              if (
                msg.indexOf('Cannot set property fetch') !== -1 ||
                file.indexOf('chrome-extension://') !== -1
              ) {
                event.stopImmediatePropagation();
                event.preventDefault();
                return false;
              }
            },
            true
          );
          window.addEventListener(
            'unhandledrejection',
            function (event) {
              var reasonStr = String((event && event.reason && (event.reason.message || event.reason)) || '');
              if (
                reasonStr.indexOf('Cannot set property fetch') !== -1 ||
                reasonStr.indexOf('chrome-extension://') !== -1 ||
                reasonStr.indexOf('token-service-api-has-not-been-used') !== -1
              ) {
                event.stopImmediatePropagation();
                event.preventDefault();
                return false;
              }
            },
            true
          );
        } catch (_) {}
      })();
    </script>
